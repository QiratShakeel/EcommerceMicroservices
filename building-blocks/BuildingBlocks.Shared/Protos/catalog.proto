syntax = "proto3";

option csharp_namespace = "BuildingBlocks.Shared.Grpc.Catalog";

package catalog;

service CatalogGrpc {
  rpc GetProductById (GetProductByIdRequest) returns (ProductResponse);
}

message GetProductByIdRequest {
  string productId = 1;
}

message ProductResponse {
  string productId = 1;
  string name = 2;
  double price = 3;
  bool isAvailable = 4;
}
